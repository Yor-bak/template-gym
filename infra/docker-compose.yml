# Stack de la API de Template-GYM, self-hosted en el servidor Linux del
# equipo (Docker + Docker Compose, cualquier host — no depende de la Pi).
# Reemplaza el stack de Supabase (7 contenedores) por solo 2: Postgres y la
# API en FastAPI — ya no hace falta Kong/GoTrue/PostgREST/Storage/Meta/Studio
# porque FastAPI hace de gateway, autenticación y capa de datos a la vez.
#
# Uso:
#   Arrancar:  docker compose up -d --build
#   Detener:   docker compose down
#   Logs:      docker compose logs -f <servicio>

name: gym-api

services:

  db:
    container_name: gym-db
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Bind mount: mover a SSD después es copiar esta carpeta y repuntar la ruta.
      - ${GYM_DATA_PATH:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Solo accesible desde el propio host — la API es la única que debe hablarle.
      # DB_PORT configurable porque el servidor puede compartir host con otros
      # proyectos del equipo que también usan Postgres en el 5432 por defecto.
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  api:
    container_name: gym-api
    build: ../apps/api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MIN: ${JWT_EXPIRY_MIN:-1440}
      QR_SECRET: ${QR_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENV: production
      ADMIN_PANEL_BASE_URL: ${ADMIN_PANEL_BASE_URL:-https://api-admin.j2ec-nodes.com}
      ADMIN_PANEL_SERVICE_KEY: ${ADMIN_PANEL_SERVICE_KEY:-}
      SYNC_SERVICE_KEY: ${SYNC_SERVICE_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      # Este es el puerto que se expone al túnel público / dominio propio.
      - "${API_PORT:-8000}:8000"
